  # triage:
  #   needs: drift
  #   if: failure()
  #   runs-on: ubuntu-latest
  #   permissions:
  #     contents: read
  #     issues: write
  #     pull-requests: write
  #   steps:
  #     - uses: actions/checkout@v4
  #       with:
  #         fetch-depth: 0
